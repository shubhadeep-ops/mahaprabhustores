<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice | Mahaprabhu Stores</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="invoice" id="invoice">Loading...</div></main><script>async function load(){let no=new URLSearchParams(location.search).get("no"),o=(await (await fetch("/api/orders")).json()).find(x=>x.no===no);if(!o)return invoice.innerHTML="<h2>Order not found</h2>";let p=await (await fetch("/api/products")).json(),sub=0;let rows=o.items.map(i=>{let x=p.find(a=>a.id===i.id)||{name:"Product",price:0};let t=x.price*i.qty;sub+=t;return `<tr><td>${x.name}</td><td>${i.qty}</td><td>₹${x.price}</td><td>₹${t}</td></tr>`}).join("");let d=sub>=500?0:30;invoice.innerHTML=`<div class="invoiceHead"><h1>MAHAPRABHU STORES</h1><p>Owner: Shyamal Mistri<br>📞 7029735884<br>📍 Rathtala Bazar, Purba Bardhaman, Kanchannagar, PIN – 713102</p></div><hr><p><b>Invoice / Order:</b> #${o.no}<br><b>Date:</b> ${o.date}<br><b>Customer:</b> ${o.name}<br><b>Mobile:</b> ${o.mobile}<br><b>Address:</b> ${o.address}</p><table><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>${rows}</table><div class="invoiceTotal"><p>Subtotal: ₹${sub}</p><p>Delivery: ${d?"₹"+d:"FREE"}</p><h2>Grand Total: ₹${o.total}</h2></div><p><b>Status:</b> ${o.status}</p></div><button onclick="window.print()">🖨️ Print / Save as PDF</button>`}load()</script></body></html>
