<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Mahaprabhu Stores</title><link rel="stylesheet" href="/style.css"></head><body><header><b>📦 My Orders</b><a href="/">← Shopping</a></header><main><section class="adminBox"><h2>Mobile Number দিয়ে Orders দেখুন</h2><div class="bar"><input id="mobile" placeholder="আপনার mobile number"><button onclick="findOrders()">View Orders</button></div><div id="list"></div></section></main><script>async function findOrders(){let m=document.getElementById("mobile").value.trim();let o=await (await fetch("/api/orders")).json();o=o.filter(x=>x.mobile===m);document.getElementById("list").innerHTML=o.length?o.map(x=>`<div class="orderCard"><h3>Order #${x.no}</h3><p>${x.date}</p><div class="timeline"><span class="${x.status!=='Cancelled'?'on':''}">🟢 Order Placed</span><span class="${['Confirmed','Out for Delivery','Delivered'].includes(x.status)?'on':''}">🟢 Confirmed</span><span class="${['Out for Delivery','Delivered'].includes(x.status)?'on':''}">🟢 Out for Delivery</span><span class="${x.status==='Delivered'?'on':''}">🟢 Delivered</span></div><h3>Grand Total ₹${x.total}</h3><button onclick="location.href='/bill.html?no='+x.no">🧾 View Bill / Print PDF</button></div>`).join(""):"<p>এই mobile number-এ কোনো order পাওয়া যায়নি।</p>"}</script></body></html>
